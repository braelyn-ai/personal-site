<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Motorcycle rides by Braelyn Boynton: routes, maps and photos.">
    <meta name="author" content="Braelyn Boynton">
    <title>Rides · Braelyn's Blog</title>
    <link rel="icon" type="image/jpeg" href="../assets/me.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=2">
    <script src="../theme.js?v=2"></script>
    <script defer src="../slurp.js?v=2"></script>
    <script defer src="../rides-list.js?v=2"></script>
    <script defer src="../ride-map.js?v=2"></script>
    <link rel="canonical" href="https://blog.braelyn.ai/rides/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Rides · Braelyn's Blog">
    <meta property="og:url" content="https://blog.braelyn.ai/rides/">
    <meta property="og:image" content="https://blog.braelyn.ai/assets/me.jpg">
    <meta property="og:site_name" content="Braelyn's Blog">
    <meta property="og:description" content="Motorcycle rides by Braelyn Boynton: routes, maps and photos.">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>
    <header>
        <p><a href="../">← Back to the blog</a></p>
        <h1>Rides</h1>
        <p class="ride-meta">Places I've been on two wheels. Click a route to read about it.</p>
    </header>

    <main>
        <div class="ride-map" data-overview="../rides.json" data-base="../"></div>
        <div id="rides-container" style="margin-top: 1.5rem;"></div>
        <p id="rides-empty" hidden>No rides posted yet. The bike is probably in the shop.</p>
    </main>

    <footer>
        <hr>
        <p><a href="../">← Back to the blog</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('../rides.json')
                .then(r => r.json())
                .then(rides => {
                    if (!rides.length) document.getElementById('rides-empty').hidden = false;
                    renderRides(rides, document.getElementById('rides-container'), '../');
                });
        });
    </script>
</body>

</html>
