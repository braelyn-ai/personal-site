<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="urban exploration, urbex, abandoned, {{KEYWORDS}}">
    <meta name="author" content="Braelyn Boynton">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="https://blog.braelyn.ai/{{COVER}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://blog.braelyn.ai/urbex/{{SLUG}}.html">
    <meta property="og:site_name" content="Braelyn's Blog">
    <meta property="article:published_time" content="{{DATE}}">
    <meta property="article:author" content="Braelyn Boynton">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@braelyn_ai">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="https://blog.braelyn.ai/{{COVER}}">
    <title>{{TITLE}} · Braelyn Boynton</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=4">
    <script src="../theme.js?v=2"></script>
    <script defer src="../slurp.js?v=2"></script>
    <script defer src="../sidebar.js?v=2"></script>
    <script defer src="../ride-map.js?v=4"></script>
    <link rel="canonical" href="https://blog.braelyn.ai/urbex/{{SLUG}}.html">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BlogPosting",
          "@id": "https://blog.braelyn.ai/urbex/{{SLUG}}.html",
          "headline": "{{TITLE_JSON}}",
          "description": "{{DESCRIPTION_JSON}}",
          "datePublished": "{{DATE}}",
          "dateModified": "{{DATE}}",
          "author": { "@id": "https://braelyn.ai/#braelyn" },
          "publisher": { "@id": "https://braelyn.ai/#braelyn" },
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "https://blog.braelyn.ai/urbex/{{SLUG}}.html"
          },
          "image": "https://blog.braelyn.ai/{{COVER}}",{{PLACE_JSONLD}}
          "inLanguage": "en-US",
          "isPartOf": { "@id": "https://blog.braelyn.ai/#blog" }
        },
        {
          "@type": "Person",
          "@id": "https://braelyn.ai/#braelyn",
          "name": "Braelyn Boynton",
          "url": "https://braelyn.ai",
          "image": "https://blog.braelyn.ai/assets/me.jpg",
          "sameAs": [
            "https://x.com/braelyn_ai",
            "https://github.com/braelyn-ai",
            "https://www.linkedin.com/in/braelyn-ai/",
            "https://www.instagram.com/braelyn.b__"
          ]
        }
      ]
    }
    </script>
</head>

<body>
    <header>
        <p><a href="./">← All spots</a></p>
        <h1>{{TITLE}}</h1>
        <p class="ride-meta"><time datetime="{{DATE}}">{{DATE_PRETTY}}</time>{{AREA_META}}</p>
    </header>

    <main>
        <article class="ride-article">
            <!-- hero -->{{HERO}}<!-- /hero -->

            <!-- A fuzzy circle around the town, never the spot itself. Set it with `new_urbex.py update --near`. -->
            {{AREA_MAP}}

            <p>Write about the place here.</p>

            <!--
              Photos. No pins and no data-lat/data-lng: exact locations stay private.
              Add class="wide" to a figure to make it span the full width.
              `new_urbex.py update` adds new photos just before the /gallery marker.
              You can also split the gallery up and put photos between paragraphs.
            -->
            <div class="ride-gallery">
{{GALLERY}}
                <!-- /gallery -->
            </div>
        </article>
    </main>

    <footer>
        <hr>
        <p><a href="./">← All spots</a> · <a href="../">Blog</a></p>
    </footer>
</body>

</html>
