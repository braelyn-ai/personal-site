# Railway's nixpacks plan runs `pip install uv==$NIXPACKS_UV_VERSION`, and Railway leaves
# that variable empty (it ignores a [variables] block here, unlike the nixpacks CLI).
# So spell out the install step with the uv version that wrote uv.lock.
[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.13.7 && uv sync --no-dev --frozen",
]
